services:
  db:
    image: postgres:15-alpine
    container_name: moqadb
    environment:
      POSTGRES_DB: moqadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: moqa-api
    volumes:
      - ./backend:/app
      - .:/data:ro


    ports:
      - "8000:8000"

    environment:
      - DB_NAME=moqadb
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True

    depends_on:
      - db

  web:
    build: ./frontend
    container_name: moqa-web
    volumes:
      - ./frontend:/app
      - moqa_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  moqa_node_modules: